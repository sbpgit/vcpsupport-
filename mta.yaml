      commands:
      - npm install
      - npm run build:cf
      - rm -rf node_modules 
      supported-platforms: []
      ignore:
      - node_modules/ 
      - dist/ 

  - name: vcpappvcpibpcalendarmaintenance
    type: html5
    path: app/VCP_IBPCALENDERWEEK_MAINTENANCE
    build-parameters:
      build-result: dist
      builder: custom
      commands:
      - npm install
      - npm run build:cf
      - rm -rf node_modules 
      supported-platforms: []
      ignore:
      - node_modules/ 
      - dist/ 

  - name: vcpappruntimeerrorlogs
    type: html5
    path: app/VCP_APPLICATION_ERROR_LOGS
    build-parameters:
      build-result: dist
      builder: custom
      commands:
      - npm install
      - npm run build:cf
      - rm -rf node_modules 
      supported-platforms: []
      ignore:
      - node_modules/ 
      - dist/ 

  - name: vcpappvcpclusteringdistance
    type: html5
    path: app/vcp_clustering_distance 
    build-parameters:
      build-result: dist
      builder: custom
      commands:
      - npm install
      - npm run build:cf
      - rm -rf node_modules 
      supported-platforms: []
      ignore:
      - node_modules/ 
      - dist/ 

  - name: vcpappvcpprodordconsumption
    type: html5
    path: app/vcpprodordconsumption
    build-parameters:
      build-result: dist
      builder: custom
      commands:
      - npm install
      - npm run build:cf
      - rm -rf node_modules 
      supported-platforms: []
      ignore:
      - node_modules/ 
      - dist/ 

  - name: vcpappvcptimeserieshistoryv3
    type: html5
    path: app/vcp_TimeSeries_History_Customer
    build-parameters:
      build-result: dist
      builder: custom
      commands:
      - npm install
      - npm run build:cf
      - rm -rf node_modules 
      supported-platforms: []
      ignore:
