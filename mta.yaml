      - dist/ 

  - name: vcpappvcptimeseriesfuturev2
    type: html5
    path: app/VCP_Time_Series_Future_V2
    build-parameters:
      build-result: dist
      builder: custom
      commands:
      - npm install
      - npm run build:cf
      - rm -rf node_modules 
      supported-platforms: []
      ignore:
      - node_modules/ 
      - dist/ 

  - name: vcpappvcptimeserieshistoryv2
    type: html5
    path: app/VCP_TimeSeries_History_V2
    build-parameters:
      build-result: dist
      builder: custom
      commands:
      - npm install
      - npm run build:cf
      - rm -rf node_modules
      ignore:
