  - name: vcpsupport-destinations
    type: com.sap.application.content
    requires:
    - name: vcpsupport-repo-host
      parameters:
        service-key:
          name: vcpsupport-repo-host-key
    - name: vcpsupport-html5-runtime
      parameters:
        service-key:
          name: vcpsupport-html5-app-runtime-service-key
    - name: vcpsupport-destination
      parameters:
        content-target: true
    parameters:
      content:
        subaccount:
          destinations:
          - Name: vcpsupport_cdm
            ServiceInstanceName: vcpsupport-html5-runtime
            ServiceKeyName: vcpsupport-html5-app-runtime-service-key
            URL: https://html5-apps-repo-rt.cfapps.us10.hana.ondemand.com/applications/cdm/vcpsupport
            sap.cloud.service: vcpsupport
          existing_destinations_policy: update
    build-parameters:
      no-source: true

resources:
  - name: vcpsupport-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        ExposeToSubaccounts: true
        HTML5Runtime_enabled: true
        init_data:
          subaccount:
            destinations:
            - Authentication: NoAuthentication
              Name: ui5
              ProxyType: Internet
              Type: HTTP
              URL: https://ui5.sap.com
            - Authentication: NoAuthentication
              CEP.HTML5contentprovider: true
              Name: vcpsupport-workzone-runtime
              ProxyType: Internet
              Type: HTTP
              URL: https://sbp-mttdev.launchpad.cfapps.us10.hana.ondemand.com
            existing_destinations_policy: update

  - name: vcpsupport-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: vcpsupport-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
