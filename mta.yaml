_schema-version: 3.3.0
ID: vcpsupport
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
 
  - name: vcpsupport-app-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: vcpsupport-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    build-parameters:
      build-result: resources
      requires:
      - artifacts:
        - vcpappsvcpactivityparameter.zip
        name: vcpappsvcpactivityparameter
        target-path: resources/

      - artifacts:
        - cdm.json
        name: vcpsupport-workzone-cdm
        target-path: resources/

      - artifacts:
        - vcpappvcpmodelversion.zip
        name: vcpappvcpmodelversion
        target-path: resources/

      - artifacts:
        - vcpappvcppredictions.zip
        name: vcpappvcppredictions
        target-path: resources/

      - artifacts:
        - vcpappvcplocproduniqid.zip
        name: vcpappvcplocproduniqid
        target-path: resources/

      - artifacts:
        - vcpappvcpjoblog.zip
        name: vcpappvcpjoblog
        target-path: resources/

      - artifacts:
        - vcpappvcptimeserieshistoryv2.zip
        name: vcpappvcptimeserieshistoryv2
        target-path: resources/

      - artifacts:
        - vcpappvcptimeseriesfuturev2.zip
        name: vcpappvcptimeseriesfuturev2
        target-path: resources/

      - artifacts:
        - vcpappvcpoptimizedpredictions.zip
        name: vcpappvcpoptimizedpredictions
        target-path: resources/

      - artifacts:
        - vcpappvcpibpcalendarmaintenance.zip
        name: vcpappvcpibpcalendarmaintenance
        target-path: resources/

      - artifacts:
        - vcpappruntimeerrorlogs.zip
        name: vcpappruntimeerrorlogs
        target-path: resources/

      - artifacts:
        - vcpappvcpclusteringdistance.zip
        name: vcpappvcpclusteringdistance
        target-path: resources/

      - artifacts:
        - vcpappvcpprodordconsumption.zip
        name: vcpappvcpprodordconsumption
        target-path: resources/

      - artifacts:
        - vcpappvcptimeserieshistoryv3.zip
        name: vcpappvcptimeserieshistoryv3
        target-path: resources/

      - artifacts:
        - vcpappvcpcriticalcomp.zip
        name: vcpappvcpcriticalcomp
        target-path: resources/

  - name: vcpsupport-workzone-cdm
    type: html5
    path: workzone
    build-parameters:
      build-result: .
      supported-platforms: []
  - name: vcpappsvcpactivityparameter
    type: html5
    path: app/VCP_ActivityParameter
    build-parameters:
      build-result: dist
      builder: custom
      commands:
      - npm install
      - npm run build:cf
      - rm -rf node_modules 
      supported-platforms: []   
      ignore:
      - node_modules/ 
      - dist/ 

  - name: vcpappvcpmodelversion
    type: html5
    path: app/vcp_model_versions
    build-parameters:
      build-result: dist
      builder: custom
      commands:
      - npm install
      - npm run build:cf
      - rm -rf node_modules 
      supported-platforms: [] 
      ignore:
      - node_modules/ 
      - dist/ 

  - name: vcpappvcppredictions
    type: html5
    path: app/VCP_PREDICTIONS
    build-parameters:
      build-result: dist
      builder: custom
      commands:
      - npm install
      - npm run build:cf
      - rm -rf node_modules 
      supported-platforms: []
      ignore:
      - node_modules/ 
      - dist/ 

  - name: vcpappvcpjoblog
    type: html5
    path: app/vcp_joblog_tracker
    build-parameters:
      build-result: dist
      builder: custom
      commands:
